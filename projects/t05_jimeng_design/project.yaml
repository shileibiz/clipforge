# 选题五：即梦AI/Clipdrop 抠图与设计（来源：MPT topics_10.md 选题六）
title: 不会PS也能做高级设计？打工人都在用的免费抠图与制图神器
voice: zh-CN-XiaoxiaoNeural
rate: "+8%"
subtitle_mode: sentence
bgm: ""
